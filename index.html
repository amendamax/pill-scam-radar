<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PillScamRadar | FDA Tainted Supplements & Fake Pills Database</title>
    <meta name="description" content="Search the official database of tainted supplements, fake diet pills, and unapproved medical products recalled by the FDA.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #2c3e50;
            --primary-color: #008f68; /* Medical Green */
            --secondary-color: #0056b3; /* Clinical Blue */
            --danger-color: #d9534f;
            --warning-color: #f0ad4e;
            --card-bg: #ffffff;
            --border-color: #e0e6ed;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-top: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .search-box input {
            width: 100%;
            max-width: 600px;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            outline: none;
            transition: border-color 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .search-box input:focus {
            border-color: var(--primary-color);
        }

        .table-wrapper {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8fafc;
            font-weight: 600;
            color: var(--secondary-color);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
        }

        .badge.critical { background-color: var(--danger-color); }
        .badge.high { background-color: var(--warning-color); }
        .badge.medium { background-color: var(--secondary-color); }

        .firm-name {
            font-weight: bold;
            color: var(--primary-color);
        }

        .description {
            font-size: 0.9rem;
            color: #555;
            max-width: 400px;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #777;
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-capsules"></i> PillScamRadar</h1>
        <p>Official FDA Database of Tainted Supplements & Unapproved Drugs</p>
    </header>

    <div class="container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search by product name, firm, or ingredient (e.g. sildenafil)..." onkeyup="debounceSearch()">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Recalling Firm</th>
                        <th>Product Details</th>
                        <th>Risk Level</th>
                        <th>FDA Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 2rem;">Loading official FDA data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer>
        <p>Data provided directly by the OpenFDA Enforcement Reports API. Not medical advice.</p>
        <p>&copy; 2026 PillScamRadar. All Rights Reserved.</p>
    </footer>

    <script>
        let debounceTimer;
        
        async function loadData(search = '') {
            const tbody = document.getElementById('tableBody');
            try {
                const res = await fetch(`/api/v1/pills?search=${encodeURIComponent(search)}`);
                const data = await res.json();
                
                if (data.results.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 2rem;">No results found.</td></tr>`;
                    return;
                }
                
                let html = '';
                data.results.forEach(item => {
                    let badgeClass = item.severity_level.toLowerCase();
                    html += `
                        <tr>
                            <td style="white-space: nowrap;">${item.discovered_date}</td>
                            <td><a href="/scam/${item.slug}" style="text-decoration: none;"><span class="firm-name">${item.entity_name}</span></a><br><small>${item.domain_url}</small></td>
                            <td class="description"><strong>${item.scam_type}</strong><br>${item.description}</td>
                            <td><span class="badge ${badgeClass}">${item.severity_level}</span></td>
                            <td><strong style="color: #d9534f;">${item.status}</strong></td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 2rem; color: red;">Error loading data.</td></tr>`;
            }
        }

        function debounceSearch() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                const query = document.getElementById('searchInput').value;
                loadData(query);
            }, 300);
        }

        // Initial load
        loadData();
    </script>
</body>
</html>
